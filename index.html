<!doctype html>
<html lang="en" class="h-full">
 <head>

  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }
    
    .cinzel {
      font-family: 'Cinzel', serif;
    }
    
    /* Diya Animation */
    @keyframes flicker {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 183, 77, 0.6)); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 183, 77, 0.9)); }
    }
    
    .diya-flame {
      animation: flicker 2s ease-in-out infinite;
    }
    
    .diya-glow {
      animation: glow 2s ease-in-out infinite;
    }
    
    /* Card Flip Animation */
    .card-container {
      perspective: 1000px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }
    
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
    }
    
    .card-back {
      transform: rotateY(180deg);
    }
    
    /* Reveal Animations */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .reveal-animation {
      animation: slideUp 0.6s ease-out forwards;
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    
    .scale-in {
      animation: scaleIn 0.5s ease-out forwards;
    }
    
    /* Tappable Glow */
    .tappable {
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .tappable::before {
      content: '';
      position: absolute;
      inset: -4px;
      background: linear-gradient(45deg, rgba(255, 183, 77, 0.3), rgba(255, 138, 101, 0.3));
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    
    .tappable:hover::before {
      opacity: 1;
    }
    
    .tappable:active {
      transform: scale(0.98);
    }
    
    /* Timeline */
    .timeline-item {
      position: relative;
      padding-left: 40px;
      margin-bottom: 30px;
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 30px;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, rgba(255, 183, 77, 0.5), transparent);
    }
    
    .timeline-icon {
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 1;
    }
    
    /* Scroll Reveal */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    
    .scroll-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* Mandala Pattern */
    .mandala-bg {
      background-image: radial-gradient(circle, rgba(212, 175, 55, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    
    /* Sparkle Effect */
    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1) rotate(180deg);
      }
    }
    
    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: sparkle 0.8s ease-out forwards;
      z-index: 9999;
    }
    
    /* Smooth Interactions */
    .interactive {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .interactive:active {
      transform: scale(0.95);
    }
    
    /* Floating Animation */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }
    
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }
    
    /* Pulse Animation */
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    
    .pulse-animation {
      animation: pulse 2s ease-in-out infinite;
    }
    
    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .card-container {
        height: 280px !important;
      }
      
      .timeline-item {
        padding-left: 35px;
      }
      
      .timeline-icon {
        width: 24px;
        height: 24px;
        font-size: 12px;
      }
    }
    
    @media (max-width: 480px) {
      .card-container {
        height: 260px !important;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
